<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Для Android -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Цвет темы браузера -->
  <meta name="theme-color" content="#4f46e5" />

  <!-- Для iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Заметки" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

  <!-- Favicon -->
  <link rel="icon" href="/icons/icon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icons/icon-16x16.png" sizes="16x16" type="image/png" />

  <title>Заметки (13-18)</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- App Shell: кэшируется и загружается мгновенно -->
  <div class="app-shell">
    <header class="app-header">
      <div class="header-content">
        <img src="/icons/icon-32x32.png" alt="Иконка" class="app-icon" />
        <h1>Мои заметки</h1>
      </div>
      <div id="online-status" class="status-badge online">Онлайн</div>
    </header>

    <!-- Навигация (часть App Shell) -->
    <nav class="app-nav">
      <button id="home-btn" class="nav-tab active">Главная</button>
      <button id="about-btn" class="nav-tab">О приложении</button>
    </nav>

    <!-- Контейнер для динамического контента -->
    <main id="app-content" class="app-main">
      <!-- Сюда подгружается контент через fetch -->
    </main>

    <!-- Кнопки push-уведомлений (Практика 16) -->
    <footer class="app-footer">
      <button id="enable-push" class="btn-push btn-push-enable">Включить уведомления</button>
      <button id="disable-push" class="btn-push btn-push-disable" style="display:none;">Отключить уведомления</button>
    </footer>
  </div>

  <!-- Socket.IO (Практика 16) -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
